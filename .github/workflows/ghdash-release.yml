name: ghdash Release
run-name: "release ${{ inputs.version || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: "Override version (optional, e.g. 1.2.3)"
        required: false
        type: string

concurrency: ${{ github.workflow }}

permissions:
  contents: write

jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup git committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - id: version
        run: bun run script/version.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHDASH_TUI_BUMP: ${{ inputs.bump }}
          GHDASH_TUI_VERSION: ${{ inputs.version }}

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Build cross-platform binaries
        run: bun run build:binary

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ghdash-binaries
          path: dist/
          include-hidden-files: true

  publish:
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          name: ghdash-binaries
          path: dist/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/ghdash-*/bin/ghdash)
          assets=()
          for f in "${files[@]}"; do
            platform=$(basename "$(dirname "$(dirname "$f")")")
            cp "$f" "$platform"
            assets+=("$platform")
          done
          gh release upload "${{ needs.version.outputs.tag }}" "${assets[@]}" --clobber

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          generated=$(gh release view "$TAG" --json body -q .body)
          {
            bun run script/install-notes.ts "$REPO" "$TAG" --stable
            echo
            echo "$generated"
          } > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false

      # Tells the project website (andycmaj/opentui-app) to re-record this app's
      # demo and keybindings from the new release. Authenticates as the
      # opentui-site-dispatch GitHub App (Contents: read and write, installed
      # only on andycmaj/opentui-app) with an installation token that expires
      # within the hour. Needs the App's client ID in the SITE_APP_CLIENT_ID
      # variable and its private key in the SITE_APP_KEY secret; skipped until
      # both are set. Setup: "App release notifications" in
      # andycmaj/opentui-app apps/site/README.md.
      - name: Check for the site dispatch App
        id: site-app
        env:
          CLIENT_ID: ${{ vars.SITE_APP_CLIENT_ID }}
          KEY: ${{ secrets.SITE_APP_KEY }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$KEY" ]; then
            echo "::notice title=Website not notified::SITE_APP_CLIENT_ID variable or SITE_APP_KEY secret not set; skipping the site dispatch"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint a site dispatch token
        id: site-token
        if: steps.site-app.outputs.enabled == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SITE_APP_CLIENT_ID }}
          private-key: ${{ secrets.SITE_APP_KEY }}
          owner: andycmaj
          repositories: opentui-app
          permission-contents: write

      - name: Notify the website
        if: steps.site-app.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.site-token.outputs.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh api repos/andycmaj/opentui-app/dispatches \
            -f event_type=app-released \
            -f "client_payload[app]=ghdash" \
            -f "client_payload[version]=$TAG"
